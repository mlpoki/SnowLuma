name: Mirror Upstream Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: fork-release-mirror-${{ github.repository }}
  cancel-in-progress: false

jobs:
  mirror:
    if: github.repository == 'mlpoki/SnowLuma'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Test mirror behavior with isolated fixtures
        run: python3 -m unittest discover -s .github/scripts -p 'test_release_mirror.py' -v
      - name: Mirror and verify the locked upstream release
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: python3 .github/scripts/release_mirror.py
      - name: Preserve snapshot and verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-mirror-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-mirror-evidence/
          if-no-files-found: warn
          retention-days: 30
